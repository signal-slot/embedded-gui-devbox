# Compose config for macOS hosts (selected automatically by the Makefile
# when `uname -s` reports Darwin). Differences from docker-compose.yml:
#
#   - No `network_mode: host` (Docker Desktop on Mac runs in a Linux VM,
#     so 'host' would scope to the VM, not the Mac).
#   - No X11 / DISPLAY / XAUTHORITY plumbing — claude / codex run in the
#     terminal, MCP servers run with QT_QPA_PLATFORM=offscreen via the
#     .mcp.json.mac template the Makefile bootstraps from.
#   - cc-home is the only bind mount; everything else lives in the
#     image (or in named docker volumes if you add them).
#
# If you later need to expose a service from the container (e.g.
# mcp-vnc acting as a VNC server on :5900), add a `ports:` block.

services:
  cc:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${VARIANT:-qt}
      args:
        UID: "${HOST_UID:-501}"
        GID: "${HOST_GID:-20}"
        # Latest upstream revs / npm versions, resolved per build by the
        # Makefile. Empty values fall back to the Dockerfile defaults
        # (`main` for git, latest-on-install for npm).
        CLAUDE_CODE_VERSION: "${CLAUDE_CODE_VERSION:-}"
        CODEX_VERSION: "${CODEX_VERSION:-}"
        MCP_PROMPT_BRIDGE_VERSION: "${MCP_PROMPT_BRIDGE_VERSION:-}"
        MCP_VNC_REV: "${MCP_VNC_REV:-main}"
        QTVNCGLPLUGIN_REV: "${QTVNCGLPLUGIN_REV:-main}"
        MCP_DESIGN2GUI_REV: "${MCP_DESIGN2GUI_REV:-main}"
        RUST_TOOLCHAIN_VERSION: "${RUST_TOOLCHAIN_VERSION:-}"
        FLUTTER_REV: "${FLUTTER_REV:-}"
    image: embedded-gui-devbox:${VARIANT:-qt}
    container_name: embedded-gui-devbox
    hostname: embedded-gui-devbox
    environment:
      - LANG=en_US.UTF-8
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./cc-home:/home/dev
    stdin_open: true
    tty: true
    command: bash
